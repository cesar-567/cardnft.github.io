<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>

  <main>
    <article class="card">

      <a class="card__image" href="#" aria-label="View Equilibrium #3429">
        <img src="./images/image-equilibrium.jpg" alt="Equilibrium NFT, a glass cube lit in red and blue">
        <span class="card__overlay">
          <img src="./images/icon-view.svg" alt="" width="48" height="48">
        </span>
      </a>

      <h1 class="card__title"><a href="#">Equilibrium #3429</a></h1>

      <p class="card__description">Our Equilibrium collection promotes balance and calm.</p>

      <div class="card__info">
        <p class="card__price">
          <img src="./images/icon-ethereum.svg" alt="" width="11" height="18">
          0.041 ETH
        </p>
        <p class="card__time">
          <img src="./images/icon-clock.svg" alt="" width="17" height="17">
          3 days left
        </p>
      </div>

      <hr class="card__divider">

      <div class="card__author">
        <img class="card__avatar" src="./images/image-avatar.png" alt="Jules Wyvern" width="33" height="33">
        <p>Creation of <a href="#">Jules Wyvern</a></p>
      </div>

    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">César Augusto, Vitor Hugo e Yehudi Schreiber</a>.
  </footer>
</body>
</html>
